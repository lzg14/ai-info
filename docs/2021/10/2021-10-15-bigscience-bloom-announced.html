        <h1>BigScience 宣布开源大模型 BLOOM 计划</h1>
        <div class="article-meta"><span class="date">入库 2021-10-15</span></div>
      </header>
      <div class="article-content">
<p>2021年10月，开源研究组织BigScience宣布启动BLOOM大语言模型训练计划，目标是构建一个完全开源的1760亿参数多语言模型。BLOOM将支持超过46种语言（含中文），由来自全球58个机构的1000多名研究人员协作完成。该项目旨在对抗大型科技公司对AI技术的垄断，让全球研究者都能使用开源大模型。模型训练使用法国Jean Zay超级计算机，历时数月完成。2022年正式发布的BLOOM成为当时最大的开源语言模型，推动了开源AI生态的发展。</p>
      </div>
      
    </article>
