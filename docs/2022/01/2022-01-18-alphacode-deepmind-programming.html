        <div class="article-meta"><span class="date">入库 2022-01-18</span></div>
      </header>
      <div class="article-content">
<p>DeepMind发布了AlphaCode，这是一个能够编写代码的AI系统，在Codeforces编程竞赛中表现出色。AlphaCode使用了<a href="../../glossary/terms/transformer.html">Transformer</a>架构结合大规模预训练和微调流程，能够生成新颖的代码解决方案。该系统在与人类程序员竞争中达到了中等水平，展示了AI在编程领域的重大进步。AlphaCode的发布标志着AI辅助编程进入新阶段，为自动化软件开发奠定基础。</p>
