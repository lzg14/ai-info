        <h1>MIT发现大语言模型涌现能力的关键阈值</h1>
        <div class="article-meta"><span class="date">入库 2022-02-14</span></div>
      </header>
      <div class="article-content">
<p>MIT等机构的研究人员发表论文，揭示了大语言模型涌现能力的关键发现。研究表明，当模型规模超过某一临界点时，会突然获得处理复杂任务的能力，这些能力在小模型中完全不存在。论文系统性地研究了模型规模与能力涌现的关系，为理解大语言模型的行为提供了重要理论依据。这一发现对AI <a href="../../glossary/terms/scaling-law.html">Scaling Law</a>s的发展具有重要指导意义。</p>
