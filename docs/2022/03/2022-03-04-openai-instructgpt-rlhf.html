        <h1>OpenAI发布InstructGPT基于人类反馈微调</h1>
        <div class="article-meta"><span class="date">入库 2022-03-04</span></div>
      </header>
      <div class="article-content">
<p>OpenAI发布了InstructGPT，这是一种基于人类反馈强化学习（RLHF）技术微调的大语言模型。InstructGPT展示了如何让AI更好地遵循人类意图和指令，在有用性、安全性和真实性方面均有显著提升。该技术成为训练<a href="../../glossary/terms/chatgpt.html">ChatGPT</a>和<a href="../../glossary/terms/gpt.html">GPT-4</a>的重要基础，标志着RLHF在AI对齐研究中的应用成熟。Instruct<a href="../../glossary/terms/gpt.html">GPT</a>的发布推动了大模型对齐技术的发展。</p>
