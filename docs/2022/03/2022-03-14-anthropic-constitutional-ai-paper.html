        <h1>Anthropic发表关于AI安全与RLHF的研究论文</h1>
        <div class="article-meta"><span class="date">入库 2022-03-14</span></div>
      </header>
      <div class="article-content">
<p>Anthropic发表了关于AI安全和宪政AI（<a href="../../glossary/terms/constitutional-ai.html">Constitutional AI</a>）的研究论文，提出了一种新的AI对齐方法。该方法通过让AI基于一组基本原则自我改进，减少对人类标注的依赖。论文详细介绍了使用RLHF和人类反馈训练AI的过程，以及如何提高AI的安全性和可解释性。Constitutional AI的概念对AI安全研究产生深远影响。</p>
