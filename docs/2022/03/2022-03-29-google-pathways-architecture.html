        <div class="article-meta"><span class="date">入库 2022-03-29</span></div>
      </header>
      <div class="article-content">
<p>Google发布了Pathways架构，这是一种新一代AI系统设计，旨在实现多模态、稀疏激活和高效计算。Pathways允许单个模型处理文本、图像、语音等多种模态，同时保持稀疏激活以提高效率。Google声称Pathways能够更高效地训练大模型，减少能耗。该架构代表了Google在AI系统层面的一次重要创新尝试。</p>
