        <div class="article-meta"><span class="date">入库 2022-04-12</span></div>
      </header>
      <div class="article-content">
<p>DeepMind发布了Chinchilla模型，并提出大语言模型最优规模的理论。研究发现，以前的大模型（如<a href="../../glossary/terms/gpt.html">GPT</a>-3）规模过大，数据量不足。通过在等比例缩放模型和数据后，Chinchilla在众多基准测试中超越了更大的模型。这一发现对大语言模型训练具有重要指导意义，影响了后续模型的设计和训练策略。</p>
