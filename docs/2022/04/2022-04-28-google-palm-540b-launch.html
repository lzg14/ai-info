        <div class="article-meta"><span class="date">入库 2022-04-28</span></div>

      <div class="article-content">
<p>Google发布了Pathways Language Model（PaLM），这是一个拥有5400亿参数的大语言模型。PaLM使用Pathways系统进行训练，在众多自然语言处理任务上展现出卓越能力。该模型展示了大规模语言模型在少样本学习和推理方面的潜力。PaLM的发布加剧了各大科技公司在大语言模型领域的竞争。</p>
