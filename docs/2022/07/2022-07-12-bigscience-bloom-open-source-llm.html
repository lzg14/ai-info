        <div class="article-meta"><span class="date">入库 2022-07-12</span></div>

      <div class="article-content">
<p>BigScience联盟发布了BLOOM，这是一个1760亿参数的开源大语言模型。BLOOM是目前最大的开源多语言模型之一，训练数据涵盖46种语言。该项目汇集了全球1000多名研究人员的努力。开源BLOOM为学术界提供了研究大模型的重要资源，推动了AI民主化进程。</p>
