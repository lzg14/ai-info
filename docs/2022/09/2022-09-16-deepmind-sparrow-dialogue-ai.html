<p>DeepMind发布了Sparrow，这是其对话AI研究的最新进展。Sparrow旨在构建更安全、更有帮助的对话系统，使用强化学习和人类反馈来改进AI行为。该项目关注AI对齐问题，探索如何让人工智能更好地理解和遵循人类意图。Sparrow的研究对安全AI系统开发具有重要参考价值。</p>
