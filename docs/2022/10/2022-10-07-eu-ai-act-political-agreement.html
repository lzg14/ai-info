<p>欧盟就AI法案（AI Act）达成政治协议，这是全球首个针对AI的综合性监管法规框架。法案根据风险等级对AI系统进行分类，对高风险应用提出严格要求，包括透明度、人类监督和问责机制。该协议标志着AI治理进入实质性立法阶段，将对全球AI产业产生深远影响。</p>
