<p>Meta发布Llama 2详细技术论文，系统阐述了这款开源大模型的设计理念与技术创新。Llama 2在模型架构、训练数据、训练方法等方面进行了全面优化，采用了Ghost<a href="../../glossary/terms/attention-mechanism.html">注意力机制</a>等新技术提升对话连贯性。该模型经过有监督微调（SFT）和人类反馈强化学习（RLHF）两个阶段的训练，在安全性与有用性之间取得了更好的平衡。Llama 2的开放商用深刻改变了全球AI竞争格局。</p>
