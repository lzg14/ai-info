      <div class="article-content">
<p>Mistral AI在发布Mistral 7B开源模型后，推出了Mistral Medium中型闭源模型，继续完善其产品线。Mistral Medium在保持较高性能的同时优化了推理成本，为企业用户提供了介于开源与顶级闭源模型之间的平衡选择。该模型延续了Mistral系列的高效率特点，在多项基准测试中表现优异，尤其在代码生成和数学推理方面展现出强劲实力。Mistral Medium的推出丰富了市场上大模型的选择层次。</p>
