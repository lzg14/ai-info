        <h1>TII发布Falcon 180B：最大开源语言模型之一</h1>
        <div class="article-meta"><span class="date">入库 2023-09-08</span></div>
      </header>
      <div class="article-content">
<p>阿布扎比技术创新研究所（TII）发布Falcon 180B大语言模型，成为当时最大的开源语言模型之一。Falcon 180B拥有1800亿参数，在高达3.5万亿tokens的数据上进行训练，在多项国际基准测试中展现出与<a href="../../glossary/terms/gpt.html">GPT-4</a>竞争的实力。该模型采用宽松的开源许可证，为商业应用提供了便利。Falcon 180B的发布彰显了中东地区在AI领域的野心与投入，对全球开源AI生态产生了深远影响。</p>
