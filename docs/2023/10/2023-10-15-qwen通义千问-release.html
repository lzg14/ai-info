        <h1>阿里云发布通义千问Qwen系列：国产开源大模型崛起</h1>
        <div class="article-meta"><span class="date">入库 2023-10-15</span></div>
      </header>
      <div class="article-content">
<p>阿里云发布通义千问（Qwen）系列开源大语言模型，标志着中国科技企业在开源大模型领域的重要突破。Qwen系列包含多个参数规模的版本，其中Qwen-14B和Qwen-72B在中文理解与生成方面表现突出。该系列模型完全开源，为中文AI开发者提供了高质量的基座选择。阿里云还开放了模型API服务，推动Qwen在产业界的广泛应用。通义千问的发布丰富了全球开源大模型生态的中文语言资源。</p>
