        <div class="article-meta"><span class="date">入库 2023-10-20</span></div>
      </header>
      <div class="article-content">
<p>OpenAI在首届开发者大会上发布GPT-4 Turbo，这是GPT-4的性能增强版本。GPT-4 Turbo将上下文窗口扩展至128K tokens，能够处理相当于300页文本的完整书籍。该模型在保持高性能的同时大幅降低了API调用成本，并优化了函数调用能力。GPT-4 Turbo还引入了知识截止日期更新机制，解决了传统大模型知识陈旧的问题。开发者大会期间，OpenAI还推出了Assistants API等新工具。</p>
