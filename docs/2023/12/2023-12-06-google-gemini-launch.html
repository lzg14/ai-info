        <h1>Google发布 1.0：多模态AI的新纪元</h1>
        <div class="article-meta"><span class="date">入库 2023-12-06</span></div>
      </header>
      <div class="article-content">
<p>Google正式发布Gemini 1.0，这是迄今为止Google最强大、最全面的多模态AI系统。Gemini从一开始就设计为原生多模态，能够无缝理解和处理文本、图像、音频和视频等多种数据类型。该模型提供Ultra、Pro、Nano三个版本，分别针对不同复杂度和部署场景。Gemini在多项基准测试中表现优异，尤其在多模态推理方面展现出超越<a href="../../glossary/terms/gpt.html">GPT-4</a>的潜力。Gemini的发布标志着Google在AI竞争中吹响了全面反击的号角。</p>
