<h2>Ultra 来了</h2>
<p>2024年1月，谷歌正式发布 Gemini Ultra，这是 Gemini 系列的旗舰版本，性能全面超越 GPT-4。Ultra 版本专为企业用户和最复杂任务设计，通过 Google AI Studio 和 Vertex AI 提供付费 API 服务。</p>
<h2>性能表现</h2>
<p>Gemini Ultra 在 MMLU（多任务语言理解）、数学（GSM8K）、代码生成（<a href="../../glossary/terms/humaneval.html">HumanEval</a>）等多项基准测试中刷新 SOTA，展示了超强推理和多步计算能力。</p>
