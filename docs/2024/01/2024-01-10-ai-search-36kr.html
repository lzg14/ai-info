<h2>AI 搜索成新风口</h2>
<p>2024年1月，36氪发布深度报道指出 AI 搜索正在成为大模型落地的重要场景。<a href="../../glossary/terms/perplexity-ai.html">Perplexity</a> 以"答案引擎"定位横空出世，估值一年内翻了17倍，成为 AI 搜索赛道的标杆产品。</p>
<h2>国内大厂跟进</h2>
<p>百度、腾讯、阿里、小红书、360 等互联网大厂纷纷推出自己的 AI 搜索产品，国内 AI 搜索赛道几乎从诞生起就十分拥挤。但 AI 搜索的门槛虽低，真正的壁垒在于搜索质量和用户体验，这为垂直 AI 搜索公司留下了生存空间。</p>
