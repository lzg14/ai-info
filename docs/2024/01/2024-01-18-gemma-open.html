      <div class="article-content">
<h2>谷歌首次真正开源</h2>
<p>1月18日，谷歌发布开源模型系列 Gemma，涵盖 2B 和 7B 两个参数规模。Gemma 采用与 <a href="../../glossary/terms/gemma.html">Gemini</a> 相同的研究和技术，但压缩为可在笔记本电脑上运行的轻量级版本，对 Meta 的 <a href="../../glossary/terms/llama.html">LLaMA</a> 系列形成直接竞争。</p>
<h2>边缘部署</h2>
<p>Gemma 的发布标志着开源大模型竞争进入新阶段——科技巨头正式加入开源战场，开发者从此可以在本地设备上运行"谷歌级"AI 模型。</p>
