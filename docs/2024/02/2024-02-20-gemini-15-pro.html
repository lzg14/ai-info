<h2>上下文之王</h2>
<p>2月，谷歌发布 Gemini 1.5 Pro，最大亮点是支持 <strong>100 万 token 上下文窗口</strong>——相当于可以一次性阅读《战争与和平》全书，或一整年的股价数据。这一能力远超当时任何其他大模型，将"长上下文"竞争推向新高度。</p>
<h2>技术创新</h2>
<p>Gemini 1.5 Pro 采用了新的混合<a href="../../glossary/terms/attention-mechanism.html">注意力机制</a>（Mixture-of-Experts + 稀疏注意力），在保持高质量输出的同时大幅降低了长上下文的计算成本，实现了"又多又省"的效果。</p>
