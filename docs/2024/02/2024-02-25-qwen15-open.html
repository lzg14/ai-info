        <div class="article-meta"><span class="date">入库 2024-02-25</span></div>
      </header>
      <div class="article-content">
<h2>🇨🇳 国产开源最强音</h2>
<p>2月25日，阿里云开源 Qwen1.5-110B，这是彼时开源大模型中参数规模最大的之一（1100 亿参数）。Qwen1.5 系列从 0.5B 到 110B 多个规格全面开源，对标 Meta <a href="../../glossary/terms/llama.html">LLaMA</a> 系列，成为中文开源大模型的一面旗帜。</p>
<h2>全球影响力</h2>
<p>Qwen1.5 开源后在 Hugging Face 下载量迅速攀升，成为全球最受欢迎的开源模型之一。其多语言能力和中文表现尤其受到国际开发者好评。</p>
