        <h1>Suno V3 / Udio 发布：AI音乐生成进入爆发期</h1>
        <div class="article-meta"><span class="date">入库 2024-03-22</span></div>
      </header>
      <div class="article-content">
<p>2024年3月22日，美国AI音乐初创公司Suno正式发布V3音乐生成模型，用户只需输入几句简单提示词，即可在15秒左右生成包含歌词、人声、伴奏在内的高质量完整歌曲，时长从上一代的80秒提升至120秒，风格覆盖流行、摇滚、古典、说唱乃至中文方言，被业界誉为AI音乐的"<a href="../../glossary/terms/chatgpt.html">ChatGPT</a>时刻"。仅一周后，竞争对手Udio于4月11日上线，同样支持文本描述生成录音室级别音乐成品，两款产品形成直接竞争。Suno V3引入AI水印系统以应对版权争议，团队仅12人却引爆了普通人的音乐创作门槛革命。</p>
