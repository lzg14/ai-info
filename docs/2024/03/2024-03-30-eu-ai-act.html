        <h1>欧盟《AI 法案》正式通过：全球首个综合性 AI 法规落地</h1>
        <div class="article-meta"><span class="date">入库 2024-03-30</span></div>
      </header>
      <div class="article-content">
<h2>🇪🇺 立法里程碑</h2>
<p>3月，欧盟《AI 法案》（EU AI Act）正式通过，成为全球首部综合性 AI 监管法规。该法案根据 AI 系统的风险等级制定不同规则：</p>
<ul><li><strong>不可接受风险</strong>：完全禁止（如社交评分、实时生物识别监控）</li><li><strong>高风险</strong>：严格限制（如医疗设备、招聘筛选）</li><li><strong>有限/最小风险</strong>：透明度要求或无限制</li></ul>
<h2>全球影响</h2>
<p>EU AI Act 被视为全球 AI 监管的"布鲁塞尔效应"——类似 GDPR，欧盟标准很可能成为全球事实标准。美国、中国等主要 AI 竞争国都在关注该法案的落地执行情况。</p>
