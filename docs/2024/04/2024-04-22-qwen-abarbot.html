      <div class="article-content">
<h2>音乐生成突破</h2>
<p>4月22日，阿里云通义千问发布 Qwen-Accord 音乐生成模型，在音乐质量、文本匹配度、生成稳定性等指标上刷新 SOTA。Qwen-Accord 能够根据歌词、风格描述生成完整音乐作品，标志着国产大模型在音乐生成领域取得重要突破。</p>
<h2>应用场景</h2>
<p>Qwen-Accord 面向音乐创作、广告配乐、游戏音乐等场景开放，与 MiniMax 的音乐生成模型形成国内双雄格局。</p>
