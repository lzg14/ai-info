<h2>新版本预告</h2>
<p>5月初，Anthropic CEO Dario Amodei 在访谈中透露 Claude 3.5 即将发布，将在编程能力、推理速度和长文档处理方面实现重大升级。同时 Anthropic 宣布获得新一笔融资，估值突破 200 亿美元。</p>
<p>Claude 3.5 的消息正值 <a href="../../glossary/terms/gpt.html">GPT-4</a> 已发布一年多，业界普遍认为 OpenAI 正在酝酿 <a href="../../glossary/terms/gpt.html">GPT</a>-5 或 GPT-4.5 的发布。大模型市场竞争进入最激烈阶段。</p>
