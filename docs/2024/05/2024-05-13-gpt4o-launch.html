      <div class="article-content">
<h2>"Omni"来了</h2>
<p>5月13日，OpenAI 发布 GPT-4o（"o"代表 Omni），这是一个原生多模态模型，能够同时处理和生成文本、音频、图像。GPT-4o 的核心突破在于<strong>实时语音对话</strong>——响应延迟接近人类自然对话，可以随时打断、切换话题，且能理解语气和情绪。</p>
<h2>定价策略</h2>
<p>GPT-4o API 价格大幅下降（是 GPT-4 Turbo 的一半），且 <a href="../../glossary/terms/chatgpt.html">ChatGPT</a> 免费用户也能使用 <a href="../../glossary/terms/gpt.html">GPT-4</a>o 的文本和多模态能力，大幅扩大了用户覆盖面。</p>
