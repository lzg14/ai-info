      <div class="article-content">
<h2>融资记录</h2>
<p>6月，Anthropic 宣布完成一笔 30 亿美元的风险投资，由谷歌领投，估值突破 180 亿美元。这笔融资是彼时 AI 创业公司最大规模单笔融资之一，使 Anthropic 成为 OpenAI 之外估值最高的 AI 独角兽。</p>
<p>融资将主要用于训练更大规模模型、提升 AI 安全研究能力和扩大 Claude 商业化规模。Anthropic 表示将坚持"AI Safety"优先路线，通过 <a href="../../glossary/terms/constitutional-ai.html">Constitutional AI</a> 等方法论确保模型的可控性。</p>
