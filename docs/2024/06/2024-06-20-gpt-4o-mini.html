<p>6月20日，OpenAI 发布 GPT-4o mini，这是 GPT-4 级别的最便宜、最轻量版本。GPT-4o mini 的 API 价格约为每百万 token $0.15（输入），比 <a href="../../glossary/terms/gpt.html">GPT-3.5</a> Turbo 还便宜，标志着大模型正式进入"分币级"定价时代。</p>
<h2>端侧部署</h2>
<p><a href="../../glossary/terms/gpt.html">GPT-4</a>o mini 的轻量化特性使其适合在移动端和边缘设备部署，推动了端侧 AI 的发展。</p>
