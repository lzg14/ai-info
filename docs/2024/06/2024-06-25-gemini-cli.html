        <div class="article-meta"><span class="date">入库 2024-06-25</span></div>

      <div class="article-content">
<h2>开发者工具</h2>
<p>6月25日，谷歌发布 Gemini CLI，这是一个开源的命令行 AI 助手，基于 Gemini 2.5 Pro 模型。开发者可以在终端直接调用 Gemini 的编程、内容生成和搜索能力，结合 VS Code 插件形成完整的本地 AI 开发环境。</p>
<h2>MCP 协议支持</h2>
<p>Gemini CLI 是最早支持 MCP（<a href="../../glossary/terms/model-context-protocol.html">Model Context Protocol</a>）的开发者工具之一，这一协议后来被广泛采纳，成为 AI 工具间互操作的重要标准。</p>
