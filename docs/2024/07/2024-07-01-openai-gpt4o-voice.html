<p>7月1日，OpenAI 正式向 <a href="../../glossary/terms/chatgpt.html">ChatGPT</a> Plus 用户开放 <a href="../../glossary/terms/gpt.html">GPT-4</a>o 语音模式。这是 AI 对话体验的质的飞跃：响应延迟降至 232 毫秒（接近人类），支持随时打断、多轮对话、语气和情感识别，AI 对话正式进入"拟人化"时代。</p>
<p><a href="../../glossary/terms/gpt.html">GPT</a>-4o 语音模式上线后，用户平均对话时长提升 3 倍以上，"AI 口语陪练"、"AI 心理咨询"等新场景迅速涌现。</p>
