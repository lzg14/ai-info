<h2>编程之王</h2>
<p>7月8日，Anthropic 发布 Claude 3.5 Sonnet v2 版本，新增对 Claude 3 Opus 的编程增强支持。同时，Claude 3.5 Sonnet 在 <a href="../../glossary/terms/swe-bench.html">SWE-bench</a>（软件工程任务）上的得分从 33% 提升至 49%，全面超越 <a href="../../glossary/terms/gpt.html">GPT-4</a>o。</p>
<h2>Claude Code 更新</h2>
<p>Claude Code 也同步更新，新增文件编辑、多步骤任务规划等能力，AI 编程工具的"<a href="../../glossary/terms/agent-ai-agent.html">Agent</a> 化"趋势加速。</p>
