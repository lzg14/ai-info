<h2>AI 搜索赛道</h2>
<p>7月，AI 搜索引擎 Perplexity 宣布其估值突破 30 亿美元，在不到两年时间内成为 AI 搜索赛道的领头羊。Perplexity 以"答案引擎"替代传统搜索引擎，直接回答问题而非展示链接，用户粘性远超传统搜索。</p>
<p>Perplexity 的成功在于：</p>
<ul><li>实时联网 + 大模型推理的结合</li><li>引用来源透明，用户可追溯</li><li>专注高质量答案而非流量变现</li></ul>
