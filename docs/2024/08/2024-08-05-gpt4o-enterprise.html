<h2>企业级能力</h2>
<p>8月5日，OpenAI 正式向企业用户开放 GPT-4o API，这是 GPT-4o 能力首次通过 API 方式提供。企业可获得：</p>
<ul><li>文本、图像、音频多模态理解</li><li>实时语音对话能力</li><li>增强的 <a href="../../glossary/terms/function-calling.html">Function Calling</a></li><li>128K 上下文窗口</li></ul>
<h2>定价策略</h2>
<p><a href="../../glossary/terms/gpt.html">GPT-4</a>o API 的定价约为 <a href="../../glossary/terms/gpt.html">GPT</a>-4 Turbo 的一半，同时面向中小企业推出更低价格的子版本，推动企业 AI 应用的规模化落地。</p>
