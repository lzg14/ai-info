<h2>AI 医疗应用</h2>
<p>8月，美国最大医疗保险集团 UnitedHealth 宣布引入 AI 系统辅助医疗保险核赔决策。该系统基于大语言模型，能够自动分析理赔申请、识别异常、提升核赔效率。</p>
<h2>️ 争议与风险</h2>
<p>这一举措引发巨大争议——AI 是否会做出不利于患者的核赔决定？是否存在算法偏见？美国多个医疗权益组织呼吁监管部门介入审查。</p>
