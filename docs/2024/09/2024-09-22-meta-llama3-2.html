        <div class="article-meta"><span class="date">入库 2024-09-22</span></div>

      <div class="article-content">
<h2>开源多模态</h2>
<p>9月22日，Meta 发布 LLaMA 3.2 系列，首次在 LLaMA 开源模型中加入多模态能力（视觉理解）。LLaMA 3.2 Vision 11B 和 90B 两个版本在视觉理解任务上对标 GPT-4o mini 和 <a href="../../glossary/terms/claude.html">Claude</a> 3 Haiku，且完全开源可商用。</p>
<h2>开源生态升级</h2>
<p><a href="../../glossary/terms/llama.html">LLaMA</a> 3.2 的多模态化标志着开源大模型正式进入"视觉时代"，开发者可以在本地运行多模态 AI 应用，不再依赖闭源 API。</p>
