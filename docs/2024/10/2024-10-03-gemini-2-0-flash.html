<h2>Flash 进化</h2>
<p>10月3日，谷歌发布 Gemini 2.0 Flash，这是 Gemini 2.0 系列的轻量高性能版本，推理速度比 1.5 Flash 提升 2 倍，成本降低 50%。Gemini 2.0 Flash 面向需要快速响应的实时对话、搜索增强等场景。</p>
<h2>上下文能力</h2>
<p>Gemini 2.0 Flash 保持 100 万 token 上下文窗口，在长文档处理、视频理解等场景中仍具优势。</p>
