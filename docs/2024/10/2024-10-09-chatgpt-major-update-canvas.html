<h2>Canvas 开放</h2>
<p>10月9日，OpenAI 向所有 ChatGPT 用户开放 Canvas 功能，这是 ChatGPT 首次支持"协作式写作和编程"——AI 和用户在同一个文档/代码文件中实时协作，而非简单的问答式交互。</p>
<p>GPT Store 正式上线，用户可以创建、分享和发现各类定制化 GPT。首批上线数千个 GPT，涵盖编程、写作、设计、教育等多个领域，形成 AI 原生应用的早期生态。</p>
