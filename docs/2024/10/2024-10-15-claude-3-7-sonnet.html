<h2>Extended Thinking</h2>
<p>10月15日，Anthropic 发布 Claude 3.7 Sonnet，这是 Anthropic 首次在模型中加入"Extended Thinking"（长思考）能力——用户在请求前可以设置模型"思考"的 Token 预算，模型会用更多时间进行深度推理后再给出答案。</p>
<h2>编程继续领跑</h2>
<p>Claude 3.7 Sonnet 在编程任务上继续保持领先，<a href="../../glossary/terms/swe-bench.html">SWE-bench</a> 得分达到 62.3%，进一步扩大与 <a href="../../glossary/terms/gpt.html">GPT-4</a>o 的编程能力差距。</p>
