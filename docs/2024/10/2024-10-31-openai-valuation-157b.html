        <div class="article-meta"><span class="date">入库 2024-10-31</span></div>
      </header>
      <div class="article-content">
<h2>新融资</h2>
<p>10月，OpenAI 完成新一轮融资，估值达到 1570 亿美元，成为全球估值最高的 AI 公司。本轮融资吸引了微软、苹果、英伟达等战略投资者，以及多家顶级VC。</p>
<h2>收入持续增长</h2>
<p>OpenAI 年化收入已突破 40 亿美元，主要来自 <a href="../../glossary/terms/chatgpt.html">ChatGPT</a> Plus 订阅、API 调用和 Azure 分成。Anthropic（200 亿+）、xAI（240 亿+）等竞争对手的估值也在持续攀升。</p>
