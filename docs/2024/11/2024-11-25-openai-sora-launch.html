<h2>Sora 开放</h2>
<p>11月25日，OpenAI 正式向 <a href="../../glossary/terms/chatgpt.html">ChatGPT</a> Plus 和 Pro 用户开放 Sora 视频生成功能。用户可以输入文本描述生成最长 60 秒的高清视频，支持多种风格和运镜控制。</p>
<h2>市场影响</h2>
<p>Sora 的开放催生了大量 AI 视频创作需求，影视、广告、教育等内容创作行业开始系统性采用 AI 视频生成工具。与此同时，视频版权、虚假信息等问题也引发广泛讨论。</p>
