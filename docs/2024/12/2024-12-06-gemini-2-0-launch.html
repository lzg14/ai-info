<h2>Agent 原生</h2>
<p>12月6日，谷歌正式发布 Gemini 2.0，这是专为 AI Agent 时代打造的多模态模型。Gemini 2.0 原生支持跨模态（文本、图像、音频、视频、代码）的实时推理和工具调用，被视为"Agent 时代的基础设施"。</p>
<h2>Deep Research</h2>
<p>Gemini 2.0 同步推出 Deep Research 功能，AI 可以像专业研究员一样自主探索复杂主题、阅读大量资料、撰写研究报告，对标 OpenAI 的 o1 推理能力。</p>
