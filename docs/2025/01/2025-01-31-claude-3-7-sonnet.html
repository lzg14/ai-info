<h2>3.7 版本</h2>
<p>1月31日，Anthropic 发布 Claude 3.7 Sonnet，这是 3.5 Sonnet 的重大升级版本，在编程能力和复杂推理方面实现突破。Claude 3.7 Sonnet 的 <a href="../../glossary/terms/swe-bench.html">SWE-bench</a> 得分从 49% 提升至 58%，继续保持编程 AI 的领先地位。</p>
<p><a href="../../glossary/terms/claude.html">Claude</a> 3.7 Sonnet 新增"可配置思考预算"功能，用户可以根据任务复杂度设置模型的思考时间。</p>
