<h2>窗口扩展</h2>
<p>3月15日，谷歌为 Gemini 1.5 Pro 发布更新，将上下文窗口从 100 万 token 扩展至 200 万 token，为处理超长文档提供了更强能力。</p>
<p>200 万 token 上下文可以一次性处理约 150 万汉字，约等于 3 部《红楼梦》的文字量。</p>
