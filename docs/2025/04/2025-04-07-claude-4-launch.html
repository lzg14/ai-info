<h2>Claude 4 登场</h2>
<p>4月7日，Anthropic 发布 Claude 4 系列，包含 Opus 和 Sonnet 两个版本。Claude 4 Opus 在 <a href="../../glossary/terms/swe-bench.html">SWE-bench</a> 编程测试中达到 72%，大幅刷新 <a href="../../glossary/terms/claude.html">Claude</a> 3.7 Sonnet 的 58% 记录。</p>
<p>Claude 4 在 Agent 架构上全面升级：多步骤任务自主规划、代码库深度理解、更稳定的工具调用、记忆能力增强。</p>
