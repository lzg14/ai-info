<h2>LLaMA 4 预览</h2>
<p>4月12日，Meta 发布 LLaMA 4 预览版，引入 MoE（混合专家）架构，在保持高性能的同时显著降低推理成本。LLaMA 4 预览版在多项基准测试中与 <a href="../../glossary/terms/gpt.html">GPT-4</a>o 持平。</p>
<p><a href="../../glossary/terms/llama.html">LLaMA</a> 4 的预览版已在 Hugging Face 引发下载热潮，开源社区对正式版充满期待。</p>
