        <h1>WAIC 2025 预览：人形机器人量产元年</h1>
        <div class="article-meta"><span class="date">入库 2025-06-10</span></div>
      </header>
      <div class="article-content">
<p>2025 WAIC（世界人工智能大会）将于 7 月 26-28 日在上海举办，主题为"智能时代，同球共济"。大会前夕，各家人形机器人厂商密集发布预告，特斯拉 TeslaBot、傅利叶智能 GR-3 等产品预计将在大会上展示最新进展。</p>
<h2>人形机器人量产元年</h2>
<p>业内预计 2025 年是人形机器人量产元年，下游企业可基于大会发布的模型进行二次开发，应用到各种场景。</p>
