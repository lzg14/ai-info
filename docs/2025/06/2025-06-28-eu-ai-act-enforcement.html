<h2>️ 正式执法</h2>
<p>6月28日，欧盟根据《AI 法案》对首批违规企业开出罚单，主要涉及高风险 AI 系统（ biometrics、招聘筛选）不合规使用。《AI 法案》正式进入执法阶段，AI 合规成为在欧洲运营企业的刚需。</p>
<h2>合规要求</h2>
<p>受罚企业主要在以下方面违规：</p>
<ul><li>风险评估文档缺失</li><li>人类监管机制不完善</li><li>违规使用生物识别数据</li></ul>
