<h2>R2 登场</h2>
<p>7月1日，DeepSeek 发布 R2 推理模型，在编程能力和多语言推理方面实现重大突破。DeepSeek R2 的训练成本继续保持极低水平（约 600 万美元），但性能已逼近 GPT-4.5 级别，引发国际资本市场强烈关注。</p>
<ul><li>编程能力（<a href="../../glossary/terms/humaneval.html">HumanEval</a>++）超越 GPT-4o</li><li>多语言推理能力显著增强</li><li>继续保持开源策略</li><li>推理成本仅为 <a href="../../glossary/terms/claude.html">Claude</a> 3.5 Sonnet 的 1/10</li></ul>
