<p>7月5日，阿里云发布 Qwen2.5-Omni，这是阿里首个端到端全模态模型，能够同时处理和生成文本、图像、视频和音频。Qwen2.5-Omni 在 Hugging Face 榜单登顶，被认为是当时最强的中文多模态模型。</p>
<ul><li>原生多模态输入输出</li><li>视频理解能力对标 <a href="../../glossary/terms/gpt.html">GPT-4</a>o</li><li>音频生成自然流畅</li><li>开源可商用</li></ul>
