<h2>Claude 4 发布</h2>
<p>7月8日，Anthropic 发布 Claude 4 系列，包含 Opus 和 Sonnet 两个版本。Claude 4 Opus 在 <a href="../../glossary/terms/swe-bench.html">SWE-bench</a> 编程测试中达到 72% 的得分，大幅刷新 <a href="../../glossary/terms/claude.html">Claude</a> 3.7 Sonnet 的记录，稳坐"最强编程 AI"宝座。</p>
<p>Claude 4 在 Agent 架构上全面升级：</p>
<ul><li>多步骤任务自主规划</li><li>代码库深度理解</li><li>更稳定的工具调用</li><li>记忆能力增强</li></ul>
