<h2>️ 大会概况</h2>
<p>7月10日，2025 世界人工智能大会（WAIC）媒体预览透露：大会将于 7 月 26-28 日在上海世博中心和世博展览馆举办，主题"智能时代，同球共济"。800 余家企业参展，展示 3000 余项前沿科技展品。</p>
<ul><li>H1 终端体验馆：具身智能、AIGC、文娱互动</li><li>H2 行业应用馆：智能驾驶、智慧城市、金融科技</li><li>H3 核心技术馆：模型、算力、语料</li><li>H4 全域链接馆：初创企业、资本对接</li></ul>
