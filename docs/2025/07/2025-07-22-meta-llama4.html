<h2>LLaMA 4 发布</h2>
<p>7月22日，Meta 发布 LLaMA 4 系列，其中旗舰版本支持 1000 万 token 上下文窗口，刷新了业界纪录。LLaMA 4 采用 MoE 架构，在保持高性能的同时大幅降低了推理成本，继续巩固开源大模型生态。</p>
<p>LLaMA 4 的发布对开源社区意义重大：</p>
<ul><li>1000 万 token 上下文免费可用</li><li>MoE 架构效率大幅提升</li><li>支持多语言和代码理解</li></ul>
