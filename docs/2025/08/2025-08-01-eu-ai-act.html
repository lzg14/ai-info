        <div class="article-meta"><span class="date">入库 2025-08-01</span></div>
      </header>
      <div class="article-content">
<h2>️ 正式生效</h2>
<p>8月1日，欧盟《AI 法案》（EU AI Act）正式生效，这是全球首部综合性 AI 监管法规。法案根据风险等级对 AI 系统分类管理：</p>
<ul><li><strong>不可接受风险</strong>：完全禁止（如社会评分、实时生物识别监控）</li><li><strong>高风险</strong>：严格限制（医疗、教育、招聘等场景）</li><li><strong>有限风险</strong>：透明度要求</li><li><strong>最小风险</strong>：无特殊限制</li></ul>
<h2>全球影响</h2>
<p>EU AI Act 被视为全球 AI 监管的标杆，其标准很可能成为国际通用准则。中国、美国等主要 AI 国家虽未完全采纳，但都在加速本国 AI 法规的制定。</p>
