<h2>GPT-5 发布</h2>
<p>8月5日（网传日期），OpenAI 正式发布 GPT-5，这是被描述为"最接近 AGI 的模型"。GPT-5 在复杂推理、自主 <a href="../../glossary/terms/agent-ai-agent.html">Agent</a>、长时记忆、跨模态理解等方面实现全面突破，被 Sam Altman 称为"我们制造过的最强大、最有价值的模型"。</p>
<ul><li><strong>Agent 原生</strong>：内置工具调用、自主规划能力</li><li><strong>长记忆</strong>：跨会话持续学习</li><li><strong>多模态</strong>：文本、图像、音频、视频、代码全面超越</li><li><strong>推理速度</strong>：比 o1 快 3 倍</li></ul>
