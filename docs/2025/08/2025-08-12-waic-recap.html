<h2>大会总结</h2>
<p>WAIC 2025 于 7 月 26-29 日成功举办，展览面积 7 万平方米，800+ 企业参展，3000+ 前沿展品亮相，100+ 全球首发新品。</p>
<p>超 150 台人形机器人集体亮相，其中特斯拉 TeslaBot 量产版、傅利叶 GR-3 等多款国产人形机器人正式发布，标志着人形机器人从技术验证进入量产阶段。</p>
<p>40+ 大模型新品发布，国产大模型性能已全面逼近 GPT-4，<a href="../../glossary/terms/deepseek.html">DeepSeek</a>、通义千问、字节豆包等形成国际竞争力。</p>
