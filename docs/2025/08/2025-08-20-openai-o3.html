<h2>o3 登场</h2>
<p>8月20日，OpenAI 发布 o3，这是 o 系列推理模型的全新一代。o3 在 ARC-AGI 基准测试中达到 87.5% 的得分，接近人类专家水平，在数学奥林匹克、科学推理等任务上的表现已超越大多数人类专家。</p>
<p>o3 采用了升级版的 Extended Thinking 技术，模型在推理过程中能够进行更深层次的自我反思和验证，显著降低了幻觉率。</p>
