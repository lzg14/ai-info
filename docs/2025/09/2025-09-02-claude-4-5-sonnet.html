<h2>4.5 版本</h2>
<p>9月2日，Anthropic 发布 Claude 4.5 Sonnet，这是 4 系列的中间版本，定位在 Sonnet（均衡）和 Opus（旗舰）之间，主打性价比。Claude 4.5 Sonnet 在大多数任务中达到 Opus 水平的 95%，但价格仅为后者的 60%。</p>
<p>Claude 4.5 Sonnet 成为主流企业应用的首选：</p>
<ul><li>AI 客服</li><li>内容审核</li><li>数据分析</li><li>常规编程任务</li></ul>
