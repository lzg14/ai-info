<h2>开发者可用</h2>
<p>9月8日，OpenAI 正式向开发者开放 GPT-5 API，这是 GPT-5 能力首次大规模商业化。开发者可以通过 API 构建基于 GPT-5 的应用，覆盖 Agent 编程、深度研究、多模态理解等场景。</p>
<h2>定价</h2>
<p>GPT-5 API 定价约为 <a href="../../glossary/terms/gpt.html">GPT-4</a>o 的 3 倍，但考虑到其 <a href="../../glossary/terms/agent-ai-agent.html">Agent</a> 能力和推理性能的提升，性价比仍然显著高于雇佣人类专家。</p>
