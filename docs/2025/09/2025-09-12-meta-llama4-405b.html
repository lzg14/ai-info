<h2>开源之王</h2>
<p>9月12日，Meta 发布 LLaMA 4 405B，这是 LLaMA 4 系列的旗舰版本，在多项基准测试中与 <a href="../../glossary/terms/gpt.html">GPT-4</a>.5 持平。<a href="../../glossary/terms/llama.html">LLaMA</a> 4 405B 完全开源可商用，继续推动开源大模型生态的发展。</p>
<p>LLaMA 4 通过新的 MoE 架构和量化技术，在保持高质量的同时大幅降低了推理成本。</p>
