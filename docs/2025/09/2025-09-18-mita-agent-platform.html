<h2>搜索革命</h2>
<p>9月18日，秘塔AI发布"Agentic Search"模式，用户不仅能用 AI 搜索，还能让 AI 直接完成任务——搜索、分析、执行一体化。秘塔AI 内置 20+ 智能体，覆盖写作、数据分析、旅行规划等多个场景。</p>
<p>秘塔AI 的 Agentic Search 代表了 AI 搜索的未来方向：不再停留于"问什么答什么"，而是"边想边搜边做"。</p>
