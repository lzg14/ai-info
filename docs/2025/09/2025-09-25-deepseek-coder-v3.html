<h2>编程旗舰</h2>
<p>9月25日，DeepSeek 发布 Coder V3，这是其编程模型的旗舰版本，在 <a href="../../glossary/terms/swe-bench.html">SWE-bench</a> 编程测试中得分超越 Claude 4 Sonnet，逼近 Opus 水平。<a href="../../glossary/terms/deepseek.html">DeepSeek</a> Coder V3 继续保持开源策略，对 Cursor、Windsurf 等 AI 编程工具形成吸引力。</p>
<p>DeepSeek Coder V3 的推理成本仅为 <a href="../../glossary/terms/claude.html">Claude</a> 3.5 Sonnet Code 的 1/20，对开发者和小型团队极具吸引力。</p>
