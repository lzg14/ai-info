<h2>估值新高</h2>
<p>10月3日，OpenAI 在新一轮融资中估值突破 2000 亿美元，成为全球有史以来估值最高的 AI 公司。本轮融资吸引了苹果、英伟达、微软等战略投资者，以及多家主权基金。</p>
<h2>收入增长</h2>
<p>OpenAI 年化收入已突破 80 亿美元，主要来自 <a href="../../glossary/terms/chatgpt.html">ChatGPT</a> 订阅、API 调用和 Azure 分成。</p>
