<h2>编程新王</h2>
<p>11月12日，字节跳动发布 Doubao Seed-Code，这是字节首款面向编程场景的 Agent 级模型，原生支持 256K 长上下文，是首个支持视觉理解能力的国产编程模型，兼容 <a href="../../glossary/terms/claude.html">Claude</a> Code 的开发者。</p>
<h2>性能表现</h2>
<p>Doubao Seed-Code 在多项主流编程基准测试中仅次于 Claude 3.5 Sonnet，位居国产编程模型第一。</p>
