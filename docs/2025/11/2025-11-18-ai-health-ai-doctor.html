<h2>AI 医疗</h2>
<p>11月18日，多国药品监管机构批准首批 AI 辅助诊疗应用，标志着 AI 在医疗领域的落地进入规模化阶段。美国 FDA 批准了多款 AI 诊断工具，中国 NMPA 批准了首批 AI 辅助读片系统。</p>
<ul><li>AI 辅助读片（CT、MRI、X光）</li><li>AI 辅助诊断（眼底、皮肤病变）</li><li>AI 药物研发加速</li></ul>
