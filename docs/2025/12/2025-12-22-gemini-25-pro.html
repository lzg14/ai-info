<h2>年终更新</h2>
<p>12月22日，谷歌发布 Gemini 2.5 Pro 的年度大更新，支持 200 万 token 上下文窗口（约 150 万汉字），刷新了业界纪录。Gemini 2.5 Pro 同时提升了视频理解、多模态推理等能力。</p>
<p>Gemini 2.5 Pro 已整合进 Google 全线产品：Search、YouTube、Gmail、Google Docs 等全面 AI 化。</p>
