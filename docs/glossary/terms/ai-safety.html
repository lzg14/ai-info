        <div class="article-meta">

        </div>

      <div class="article-content">
<p><strong>解释：</strong> AI Safety 是研究如何确保 AI 系统安全、可控、可预测的领域，核心问题包括：如何防止 AI 产生有害输出、如何确保 AI 目标与人类意图一致、如何避免 AI 在追求目标时产生意外危害。Anthropic 将其视为公司核心使命，OpenAI 也有专门的安全团队。</p>
<p><strong>为什么重要：</strong> 随着 AI 能力越来越强，AI Safety 成为决定 AI 能否安全造福人类的关键议题，也是中美 AI 监管政策的重要背景。</p>
