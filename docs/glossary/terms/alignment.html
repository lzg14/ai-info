        <h1>Alignment</h1>
        <div class="article-meta">
          <span class="source">英文：Alignment</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> Alignment（对齐）是指确保 AI 系统的行为与人类意图和价值观一致的研究领域。AI 能力越强，如果行为不符合人类意图，危害越大。对齐问题包括：如何让 AI 真正理解人类意图？如何防止 AI 在追求目标时产生意外行为？如何确保 AI 在不同情境下都做出「有益且无害」的选择？</p>
<p><strong>为什么重要：</strong> Alignment 是 AI 安全的核心子领域，RLHF、Constitutional AI、Red Teaming 等技术都是 Alignment 的具体方法。GPT-4 之后，Alignment 成为 AI 研究的显学。</p>
