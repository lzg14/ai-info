        <h1>Beam Search</h1>
        <div class="article-meta">
          <span class="source">英文：Beam Search</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> Beam Search 是大模型生成文本时的经典解码策略。与贪婪搜索（每次选概率最高的词）不同，Beam Search 每次保留 B 个（束宽）最可能的候选序列，综合考虑整个序列的概率而非每步最优，能够产生质量更高的文本。是 GPT 等模型推理时广泛使用的解码方法。</p>
<p><strong>为什么重要：</strong> Beam Search 是大模型生成质量的重要影响因素，与随机采样（Temperature/Top-p）共同构成两种主流解码范式，理解它有助于理解 LLM 输出质量的调控机制。</p>
