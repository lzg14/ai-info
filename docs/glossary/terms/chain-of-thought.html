        <h1>思维链</h1>
        <div class="article-meta">
          <span class="source">英文：Chain of Thought (CoT)</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> 思维链是一种让模型&quot;思考后再回答&quot;的技术。传统方式是直接输出答案；CoT 方式是先让模型输出一系列推理步骤，再给出最终答案。研究发现，这种&quot;先想后答&quot;的方式能显著提升复杂推理任务（数学、逻辑、代码）的准确率。</p>
<p>进阶版本包括：CoT（显式推理步骤）、Self-CoT（模型自己发现推理链）、Tree of Thought（多路径推理）、Reflexion（反思后修正）等。</p>
<p><strong>为什么重要：</strong> CoT 直接提升了模型的推理能力，是 DeepSeek-R1、o1、o3 等推理模型的技术核心。</p>
      </div>
    </article>
