<p><strong>解释：</strong> ChatGPT 是 OpenAI 在 2022 年 11 月 30 日发布的对话 AI 产品，基于 GPT-3.5（后升级 GPT-4），能够进行自然流畅的对话、写作、编程、分析等任务。上线 5 天用户破百万，2 个月破 1 亿，创下互联网产品增长最快纪录，引发了全球性的 AI 浪潮。</p>
<p><strong>为什么重要：</strong> ChatGPT 是 AI 进入大众视野的转折点，直接引爆了 2023 年的生成式 AI 创业潮和投资热潮，改变了全球对 AI 的认知。</p>
