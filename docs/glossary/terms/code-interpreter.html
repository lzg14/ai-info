        <h1>Code Interpreter</h1>
        <div class="article-meta">
          <span class="source">英文：Code Interpreter</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> Code Interpreter 是 ChatGPT 的一个插件功能，能在沙箱环境中自动编写并执行 Python 代码来完成用户任务——数据分析、图表生成、数学计算、文件处理等。它让 GPT-4 拥有了在对话中实时运行代码的能力，相当于给 AI 配备了一个可编程的计算器。</p>
<p><strong>为什么重要：</strong> Code Interpreter 让 AI 从「只会说话」进化到「能做实事」——能直接处理文件、运行分析、生成可视化结果，是 AI Agent 能力的重要早期展示。</p>
