        <h1>Constitutional AI</h1>
        <div class="article-meta">
          <span class="source">英文：Constitutional AI (CAI)</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> Constitutional AI 是 Anthropic 提出的 AI 对齐方法。核心思想是让 AI 在学习人类偏好时参照一份「宪法」（包含一系列原则，如「尽量减少有害输出」），AI 通过自我批评和迭代改进来符合这些原则，而不完全依赖人类反馈。</p>
<p><strong>为什么重要：</strong> Constitutional AI 是 Claude 模型能力的核心技术来源，代表了 RLHF 之外另一条重要的 AI 对齐路线，对 AI 安全性有重要意义。</p>
