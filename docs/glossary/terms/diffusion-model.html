        <h1>扩散模型</h1>
        <div class="article-meta">
          <span class="source">英文：Diffusion Model</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> 扩散模型是生成图像（也扩展到音频、视频）的主流深度学习技术。其原理类似物理中的扩散过程：先向图片添加噪声直到完全模糊，再学习逆向去噪过程——模型由此学会&quot;从噪声中生成图像&quot;。</p>
<p>典型代表包括 DALL-E、Stable Diffusion、Midjourney。</p>
<p><strong>为什么重要：</strong> 扩散模型让 AI 生成图片的质量产生了质的飞跃，是 2022-2024 年 AI 图像生成爆发的核心技术。</p>
