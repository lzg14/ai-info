        <div class="article-meta">

        </div>

      <div class="article-content">
<p><strong>解释：</strong> Dify 是一个开源的 LLM 应用开发平台，提供可视化的工作流编排、Agent 设计、RAG 管道、模型管理等能力。用户可以在网页上通过拖拽构建复杂的 AI 应用，无需编写代码。核心理念是让 AI 应用开发「可视化、可复用、可迭代」。</p>
<p><strong>为什么重要：</strong> Dify 是 2024 年中国开源 AI 应用平台的代表，与 LangChain/AutoGen 相比更适合非程序员，在 GitHub 上获得了大量关注，是中国 AI 应用开发者的热门选择。</p>
