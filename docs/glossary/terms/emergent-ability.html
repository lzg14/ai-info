        <h1>涌现能力</h1>
        <div class="article-meta">
          <span class="source">英文：Emergent Ability</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> 涌现能力指模型在规模达到某个临界点后，突然涌现出的小模型不具备的全新能力。比如某些复杂推理能力在 GPT-3（175B）上不存在，但在 GPT-4 上突然出现，之间没有平滑过渡。</p>
<p>这类似于水在 100°C 突然沸腾——温度（模型规模）达到临界点前是液态水，达到后突然变成气体。</p>
<p><strong>为什么重要：</strong> 涌现能力解释了&quot;规模越大，智能越高&quot;这一并非线性而是突变的现象，也是大模型 Scaling Law（规模定律）的核心证据之一。</p>
      </div>
    </article>
