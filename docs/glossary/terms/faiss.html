        <h1>FAISS</h1>
        <div class="article-meta">
          <span class="source">英文：FAISS (Facebook AI Similarity Search)</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> FAISS 是 Meta AI 开源的向量相似度搜索库，专门用于在海量向量数据中快速找到最相似的项。RAG 系统需要在私有知识库中找到与用户问题最相关的文档片段——这本质上是一个向量检索问题，FAISS 正是解决这一问题的主流技术方案。</p>
<p><strong>为什么重要：</strong> FAISS 是 RAG 和向量数据库的底层核心技术，支持十亿级向量毫秒级检索，几乎所有开源 RAG 系统的向量索引都用 FAISS 或其云端等效方案。</p>
