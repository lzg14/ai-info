        <div class="article-meta">
          <span class="source">英文：Few-Shot Learning</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> Few-Shot 是大模型的一种惊人能力：不需要重新训练，在提问时给出 1-5 个示例（输入+输出对），模型就能学会并执行新任务。比如想让模型把英文翻译成中文，只需在问题里给几个英译中例子，模型就能照做，不需要任何额外训练。</p>
<p><strong>为什么重要：</strong> Few-Shot 是 GPT-3 论文的核心卖点，也是大模型通用性的来源——同一个模型靠提示就能适应无数种任务，极大降低了 AI 应用门槛。</p>
