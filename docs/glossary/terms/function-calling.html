        <h1>Function Calling</h1>
        <div class="article-meta">
          <span class="source">英文：Function Calling</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> Function Calling 是大模型的一种能力——让模型在生成文本时，能够主动调用外部函数/工具（如查询天气、搜索网页、操作数据库），而不是只能输出文字。模型输出一个结构化的&quot;函数调用请求&quot;，由外部程序执行后返回结果，模型再继续生成。</p>
<p><strong>为什么重要：</strong> Function Calling 是 Agent 架构的基础能力之一，使得 AI 能从&quot;聊天&quot;进化到&quot;做事&quot;。</p>
