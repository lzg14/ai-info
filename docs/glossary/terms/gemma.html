        </div>

      <div class="article-content">
<p><strong>解释：</strong> Gemma 是 Google 在 2024 年 2 月发布的开源大模型系列，包含 2B 到 7B 参数多个版本。Gemma 源自拉丁语 protector，与 Google 的 Gemini 同源但完全开源。Gemma 在多项基准测试中超越了同尺寸的 LLaMA-2。</p>
<p><strong>为什么重要：</strong> Gemma 是 Google 首次真正认真对待开源的标志，也是在 Meta LLaMA 开源路线压力下的战略反击。它的发布让开源社区有了 Google 官方的选择。</p>
