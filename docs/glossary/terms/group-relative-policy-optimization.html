        <h1>GRPO</h1>
        <div class="article-meta">
          <span class="source">英文：Group Relative Policy Optimization (GRPO)</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> GRPO 是 DeepSeek 在 2024-2025 年提出的强化学习训练方法，是 PPO（Proximal Policy Optimization）的变种。核心改进是：不再依赖独立的 Critic 模型（Reward Model），而是通过同组问题相互比较来估算优势函数，大幅降低了训练成本和算力需求。</p>
<p><strong>为什么重要：</strong> GRPO 是 DeepSeek-V3 和 DeepSeek-R1 训练中的关键技术，也让「小团队也能训出顶级模型」成为可能。</p>
      </div>
