        <h1>Hallucination</h1>
        <div class="article-meta">
          <span class="source">英文：Hallucination (AI)</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> Hallucination（幻觉）是指大模型一本正经地胡说八道——输出看似流畅合理但实际错误或不存在的内容。比如 AI 引用不存在的论文、编造不真实的日期或统计数据。这是当前大模型最核心的安全和可靠性问题之一。</p>
<p><strong>为什么重要：</strong> 幻觉问题直接影响了 AI 在医疗、法律、金融等高风险领域的应用，也是 RAG（检索增强生成）被发明出来解决的核心问题。</p>
