        <h1>上下文学习</h1>
        <div class="article-meta">
          <span class="source">英文：In-Context Learning (ICL)</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> 上下文学习是指大模型不需要额外训练，在推理时通过在提示（Prompt）中提供少量示例，就能学会新任务的能力。比如你想让模型用 JSON 格式回答，不用专门训练，只需在提问时给几个 JSON 示例，模型就能学会。</p>
<p><strong>为什么重要：</strong> ICL 是 GPT-3 最重要的发现之一，也是大模型&quot;通用性&quot;的来源之一——同一个模型，靠提示就能适应无数种任务。</p>
      </div>
    </article>
