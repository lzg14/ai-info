        <h1>Instruction Tuning</h1>
        <div class="article-meta">
          <span class="source">英文：Instruction Tuning</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> Instruction Tuning 是一种让大模型学会「听懂人类指令」的微调方法。具体做法是用大量（指令, 期望输出）对来训练模型，使其能理解「把这段文字翻译成英文」这样的自然语言指令，并给出正确响应。</p>
<p><strong>为什么重要：</strong> Instruction Tuning 是 GPT-3 之后 NLP 最重要的技术突破，让大模型从「续写文本」进化到「听懂指令并执行」，是 ChatGPT 能对话的基础技术。</p>
