        <h1>LlamaIndex</h1>
        <div class="article-meta">
          <span class="source">英文：LlamaIndex</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> LlamaIndex 是一个专注于知识检索增强（RAG）的 LLM 应用开发框架，提供数据连接器、索引结构（List Index、Vector Store Index、Tree Index 等）、查询接口等模块。与 LangChain 相比，LlamaIndex 更专注于知识检索场景，是构建私有知识库问答系统的首选框架。</p>
<p><strong>为什么重要：</strong> LlamaIndex 是 RAG 场景最流行的框架，2023-2026 年几乎所有企业知识库问答项目都有 LlamaIndex 的身影。</p>
