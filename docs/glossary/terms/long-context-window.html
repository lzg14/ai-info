        <h1>长上下文窗口</h1>
        <div class="article-meta">
          <span class="source">英文：Long Context Window</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> 上下文窗口指 LLM 一次能处理的最大 token 数量。短上下文（如 4K token）意味着只能处理短文档；长上下文（如 1M token）意味着可以处理整本书、整个代码库、多份长文档的比较阅读。</p>
<p>2025-2026 年，各家厂商在长上下文上不断突破：DeepSeek 200K、GPT-4o 128K、Kimi 200K+，部分模型已突破 1000K。</p>
<p><strong>为什么重要：</strong> 长上下文是大模型落地的关键——让它能够处理长篇小说、法律合同、代码库分析等真实场景。</p>
      </div>
    </article>
  </div>
