        <h1>MMLU</h1>
        <div class="article-meta">
          <span class="source">英文：Massive Multitask Language Understanding (MMLU)</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> MMLU 是目前最权威的大模型综合能力测试，涵盖 57 个学科（数学、历史、医学、物理等），选择题形式，共约 15,907 道题。GPT-4 在 MMLU 上达到 86.4%，首次超越人类专家平均水平，被视为 LLM 达到专家级智力的标志性事件。</p>
<p><strong>为什么重要：</strong> MMLU 是大模型最重要的基准测试之一，各模型在 MMLU 上的得分是衡量其综合能力的重要指标，也是各厂商刷榜的主战场。</p>
