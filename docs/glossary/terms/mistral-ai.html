        <h1>Mistral</h1>
        <div class="article-meta">
          <span class="source">英文：Mistral AI</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> Mistral AI 是 2023 年成立于法国巴黎的 AI 独角兽公司，由前 Meta 和 DeepMind 研究员创办。Mistral 以极快的速度发布了多款开源模型（Mistral 7B、Mixtral 8x7B），其中 Mixtral 8x7B 是首个达到 GPT-3.5 水平的开源 MoE 模型，引发了开源社区的热烈追捧。</p>
<p><strong>为什么重要：</strong> Mistral 是开源大模型阵营的重要力量，它的崛起打破了美国公司在开源领域的垄断格局，也让欧洲终于有了一家能与美国 AI 巨头竞争的公司。</p>
