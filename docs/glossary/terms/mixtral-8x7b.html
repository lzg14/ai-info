        <h1>Mixtral</h1>
        <div class="article-meta">
          <span class="source">英文：Mixtral 8x7B</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> Mixtral 8x7B 是 Mistral AI 在 2023 年 12 月发布的稀疏混合专家模型（MoE），总参数量 46.7B，每次推理只激活 12.9B 参数。在多项基准测试中超越了 GPT-3.5 和 Llama 2 70B，成为首个达到 GPT-3.5 水平的开源 MoE 模型，引发了开源社区的巨大反响。</p>
<p><strong>为什么重要：</strong> Mixtral 证明了 MoE 架构在开源模型上的可行性，开启了 2024 年开源大模型的 MoE 军备竞赛，DeepSeek-V3、Qwen1.5-MoE 等都受到其启发。</p>
