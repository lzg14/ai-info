        <h1>MCP</h1>
        <div class="article-meta">
          <span class="source">英文：Model Context Protocol (MCP)</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> MCP 是 Anthropic 在 2024 年 11 月推出的开放协议，旨在让 AI 模型能够标准化地连接各种外部工具和数据源（数据库、文件系统、API、浏览器等）。类比：USB 接口让各种设备可以插到电脑上，MCP 让各种工具可以插到 AI 模型上。</p>
<p><strong>为什么重要：</strong> MCP 解决了 AI 应用开发中的&quot;工具孤岛&quot;问题，2025 年已成为 AI 工具互联的事实标准，Claude、Cursor、Cline 等主流工具均已支持。</p>
