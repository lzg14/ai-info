        <h1>Multimodal</h1>
        <div class="article-meta">
          <span class="source">英文：Multimodal</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> 多模态指能够处理多种类型数据（文本、图像、音频、视频、代码等）的大模型。GPT-4V（视觉）、GPT-4o（语音）、Gemini（视频）、Sora（文生视频）都是多模态模型。核心挑战是让不同模态的信息在同一语义空间中对齐。</p>
<p><strong>为什么重要：</strong> 多模态是 2023-2026 年大模型发展的最重要方向，让 AI 从「只能看文字」进化到「能看懂世界」，也是具身智能、AR/VR 应用的底层支撑。</p>
