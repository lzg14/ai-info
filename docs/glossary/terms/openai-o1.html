      <div class="article-content">
<p><strong>解释：</strong> o1 是 OpenAI 在 2024 年 9 月发布的推理模型系列，核心创新是「思维链外化」——让模型在给出最终答案前，先显式地生成一长串推理步骤（Think），然后基于这些推理得出答案。在数学、物理、化学竞赛题上 o1 达到了国际奥赛金牌水平。</p>
<p><strong>为什么重要：</strong> o1 的推出被视为 LLM 推理能力从「快速直觉」进化到「慢速思考」的转折点，也带动了整个业界对推理模型的关注（DeepSeek-R1、QwQ 等纷纷跟进）。</p>
