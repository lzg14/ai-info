        <h1>RLHF</h1>
        <div class="article-meta">
          <span class="source">英文：Reinforcement Learning from Human Feedback (RLHF)</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> RLHF 是一种训练大模型使其行为更符合人类意图的技术。步骤是：① 让模型生成多个回答，请人类对质量排序；② 用这些排序数据训练一个&quot;奖励模型&quot;（Reward Model）；③ 用奖励模型引导主模型通过强化学习（如 PPO 算法）优化输出质量。</p>
<p><strong>为什么重要：</strong> ChatGPT 能做到&quot;有帮助、无害、真实&quot;，RLHF 功不可没。它是将人类价值观注入大模型的核心技术。</p>
      </div>
