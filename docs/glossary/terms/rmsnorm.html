        <h1>RMSNorm</h1>
        <div class="article-meta">
          <span class="source">英文：RMSNorm (Root Mean Square Layer Normalization)</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> RMSNorm 是 2018 年提出的比 LayerNorm 更高效的归一化方法，由 LLaMA 论文在 2023 年大规模采用而广为人知。它去掉了 LayerNorm 中计算均值的部分，只用均方根（RMS）进行归一化，减少了约一半的计算量，同时在很多任务上效果相当。</p>
<p><strong>为什么重要：</strong> RMSNorm 是 LLaMA 架构的关键组件，被几乎所有现代大模型采用，是 Transformer 效率优化的重要组成部分。</p>
      </div>
