        <h1>RoPE</h1>
        <div class="article-meta">
          <span class="source">英文：Rotary Position Embedding (RoPE)</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> RoPE 是苏剑林于 2021 年提出的位置编码方法，被 LLaMA、Falcon、Qwen 等多数开源大模型采用。核心思想是将位置信息编码为旋转矩阵，让模型在处理相对位置关系时具有更好的数学性质，而且无需像绝对位置编码那样对每个位置单独学习。</p>
<p><strong>为什么重要：</strong> RoPE 是 2021 年后大多数开源大模型的标配位置编码，直接影响了中国几乎所有大模型（通义千问、DeepSeek 等）的架构选择。</p>
      </div>
