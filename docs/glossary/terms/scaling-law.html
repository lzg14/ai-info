        <h1>Scaling Law</h1>
        <div class="article-meta">
          <span class="source">英文：Scaling Law</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> Scaling Law 描述的是大模型性能与模型参数规模、训练数据量、计算量之间的幂律关系。简单说就是：模型越大、训练数据越多、算力越强，模型能力就越强——而且这种提升是可以预测的。这一定律是 OpenAI 坚持「越大越好」路线的理论依据，也是 GPT-2 到 GPT-3 到 GPT-4 一路狂飙的底层逻辑。</p>
<p><strong>为什么重要：</strong> 理解 Scaling Law 是理解 2020-2026 年大模型军备竞赛的钥匙。很多模型决策（如为什么各家疯狂囤卡）都可以从这一定律找到答案。</p>
