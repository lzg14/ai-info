        <h1>Speculative Decoding</h1>
        <div class="article-meta">
          <span class="source">英文：Speculative Decoding</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> 投机解码是一种加速大模型推理的技术。原理是：用一个小模型（Draft Model）快速生成多个候选词（投机阶段），再用大模型（Target Model）并行验证这些候选词，如果大模型也认为正确就一次性接受多个词，从而节省计算。类似于考试时先快速写出草稿，再回头检查。</p>
<p><strong>为什么重要：</strong> 投机解码能将大模型推理速度提升 2-4 倍，是 2024-2026 年大模型推理优化的重要方向，尤其适合批量推理场景。</p>
