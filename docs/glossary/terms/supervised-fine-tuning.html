        <h1>SFT</h1>
        <div class="article-meta">
          <span class="source">英文：Supervised Fine-Tuning (SFT)</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> SFT 是在预训练好的大模型基础上，用人工标注的高质量数据（问答对、指令-响应对）进行额外训练，使模型在特定任务或风格上表现更好。这是 RLHF 的第一步，也是很多垂直领域模型训练的必经步骤。</p>
<p><strong>为什么重要：</strong> 开源模型（如 LLaMA、Qwen）之所以能快速在各个垂直领域应用，SFT 是核心技术——用几百条行业数据就能让通用模型变成领域专家。</p>
      </div>
