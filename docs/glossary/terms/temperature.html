        <h1>Temperature</h1>
        <div class="article-meta">
          <span class="source">英文：Temperature</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> Temperature 是控制 LLM 输出随机性的超参数。值为 0 时输出几乎确定（最贪婪解码），值越高输出越随机多样（值为 1.0 是正常概率分布，&gt;1.0 更随机，&lt;1.0 更确定性）。一般写作/创意任务用 0.7-0.9，精确问答用 0-0.3。</p>
<p><strong>为什么重要：</strong> Temperature 是控制 LLM 输出风格的「创意旋钮」，是 Prompt 工程中最重要的参数之一，理解它对于调优 AI 应用输出质量至关重要。</p>
