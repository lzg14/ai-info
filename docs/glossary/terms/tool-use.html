        <h1>Tool Use</h1>
        <div class="article-meta">
          <span class="source">英文：Tool Use</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> Tool Use 是指大模型调用外部工具（搜索引擎、数据库、API、计算器等）来扩展自身能力的技术。与 Function Calling 类似，但更强调「使用工具完成真实任务」这一动作，比如让 AI 查询天气后告诉你该不该带伞。</p>
<p><strong>为什么重要：</strong> Tool Use 是 AI Agent 能力的基础——如果 AI 只能说话不能行动，就无法真正自动化任务。</p>
