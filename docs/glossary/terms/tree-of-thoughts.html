        <h1>Tree of Thoughts</h1>
        <div class="article-meta">
          <span class="source">英文：Tree of Thoughts (ToT)</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> ToT 是 CoT（思维链）的进阶版。CoT 是线性思考（一步一步往下想），ToT 允许模型在每一步生成多个可能的思考分支，构建一棵树，然后通过搜索算法（广度优先/深度优先）找到最优路径。适合需要探索和规划复杂问题的场景。</p>
<p><strong>为什么重要：</strong> ToT 解决了 CoT 在复杂任务上容易「一条路走到黑」的问题，让模型能够主动探索多条推理路径，是数学证明、代码生成等复杂推理任务的重要方法。</p>
      </div>
