        <h1>Zero-Shot</h1>
        <div class="article-meta">
          <span class="source">英文：Zero-Shot Learning</span>
        </div>
      </header>
      <div class="article-content">
<p><strong>解释：</strong> Zero-Shot 是一种比 Few-Shot 更极致的能力：模型在没有任何示例的情况下，仅凭自然语言指令就能执行全新任务。比如对模型说「把这张照片变成素描风格」，模型不需要任何示例就能执行。</p>
<p><strong>为什么重要：</strong> Zero-Shot 意味着大模型可以通过纯语言描述泛化到从未见过的任务，是 AI 通用能力的重要标志。</p>
      </div>
